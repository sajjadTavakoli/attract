spring:
  application:
    name: user
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    show-sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console


server:
  port: 8084

eureka:
  instance:
    preferIpAddress: true
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8072/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"