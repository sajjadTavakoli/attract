server:
  port: 8073

spring:
  application:
    name: gateway-server
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user
          predicates:
            - Path=/user/**
        - id: project-service
          uri: lb://project
          predicates:
            - Path=/project/**


eureka:
  instance:
    preferIpAddress: true
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8072/eureka/

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.boot.actuate: DEBUG