version: '3.8'

services:
  database:
    image: postgres:15
    container_name: database
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "ostock_dev"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/1-init.sql
      - ./data.sql:/docker-entrypoint-initdb.d/2-data.sql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  configserver:
    image: attract/config-server:0.0.1-SNAPSHOT
    container_name: config-server
    restart: unless-stopped
    ports:
      - "8071:8071"
#    environment:
#      ENCRYPT_KEY: "fje83Ki8403Iod87dne7Yjsl3THueh48jfuO9j4U2hf64Lo"
    networks:
      - backend

  eurekaserver:
    image: attract/eureka-server:0.0.1-SNAPSHOT
    container_name: eureka-server
    restart: unless-stopped
    ports:
      - "8072:8072"
    depends_on:
      database:
        condition: service_healthy
      configserver:
        condition: service_started
    networks:
      - backend

  gatewayserver:
    image: attract/gateway-server:0.0.1-SNAPSHOT
    container_name: gateway-server
    restart: unless-stopped
    ports:
      - "8073:8073"
    environment:
      PROFILE: "default"
      SERVER_PORT: "8073"
      CONFIGSERVER_URI: "http://config-server:8071"
      EUREKASERVER_URI: "http://eureka-server:8072/eureka/"
    depends_on:
      database:
        condition: service_healthy
      configserver:
        condition: service_started
      eurekaserver:
        condition: service_started
    networks:
      - backend

  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"
    networks:
      - backend

  kafkaserver:
    image: bitnami/kafka:latest
    container_name: kafka-server
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: "zookeeper:2181"
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-server:9092"
    depends_on:
      - zookeeper
    networks:
      - backend

  redisserver:
    image: redis:alpine
    container_name: redis-server
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - backend

  projectservice:
    image: attract/project:0.0.1-SNAPSHOT
    container_name: project-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      PROFILE: "dev"
      CONFIGSERVER_URI: "http://config-server:8071"
      DATABASESERVER_PORT: "5432"
      ENCRYPT_KEY: "IMSYMMETRIC"
    depends_on:
      database:
        condition: service_healthy
      configserver:
        condition: service_started
      kafkaserver:
        condition: service_started
    networks:
      - backend

  userservice:
    image: attract/user:0.0.1-SNAPSHOT
    container_name: user-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      PROFILE: "dev"
      CONFIGSERVER_URI: "http://config-server:8071"
      DATABASESERVER_PORT: "5432"
      ENCRYPT_KEY: "IMSYMMETRIC"
    depends_on:
      database:
        condition: service_healthy
      configserver:
        condition: service_started
      kafkaserver:
        condition: service_started
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
